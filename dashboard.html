<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Bot Panel</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div>
          <p class="eyebrow">Discord Bot</p>
          <h1>Panel administracyjny</h1>
        </div>
        <span id="statusBadge" class="status-badge loading">Ładowanie...</span>
      </header>

      <nav class="tabs" aria-label="Zakładki dashboardu">
        <button class="tab active" data-tab="overview">Status</button>
        <button class="tab" data-tab="servers">Serwery</button>
        <button class="tab" data-tab="logs">Logi</button>
      </nav>

      <main id="overviewTab" class="tab-panel active">
        <div class="grid">
          <section class="card">
            <span class="label">Status</span>
            <strong id="statusText">Sprawdzam...</strong>
          </section>
          <section class="card">
            <span class="label">Czas działania</span>
            <strong id="uptimeText">--</strong>
          </section>
          <section class="card">
            <span class="label">Serwery</span>
            <strong id="guildsText">--</strong>
          </section>
          <section class="card">
            <span class="label">Tickety</span>
            <strong id="ticketServersText">--</strong>
          </section>
          <section class="card">
            <span class="label">Webhooki</span>
            <strong id="webhookServersText">--</strong>
          </section>
          <section class="card">
            <span class="label">Logi</span>
            <strong id="logsCountText">--</strong>
          </section>
        </div>
      </main>

      <section id="serversTab" class="tab-panel">
        <div class="panel">
          <div class="panel-header">
            <h2>Lista serwerów</h2>
            <span id="updatedAt" class="muted">--</span>
          </div>
          <div id="guilds" class="guild-list"></div>
        </div>
      </section>

      <section id="logsTab" class="tab-panel">
        <div class="panel">
          <div class="panel-header">
            <h2>Ostatnie zdarzenia</h2>
            <span id="logsUpdatedAt" class="muted">--</span>
          </div>
          <div id="logs" class="log-list"></div>
        </div>
      </section>
    </div>

    <script>
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const uptimeText = document.getElementById('uptimeText');
      const guildsText = document.getElementById('guildsText');
      const ticketServersText = document.getElementById('ticketServersText');
      const webhookServersText = document.getElementById('webhookServersText');
      const logsCountText = document.getElementById('logsCountText');
      const updatedAt = document.getElementById('updatedAt');
      const logsUpdatedAt = document.getElementById('logsUpdatedAt');
      const guildsContainer = document.getElementById('guilds');
      const logsContainer = document.getElementById('logs');
      const tabButtons = document.querySelectorAll('.tab');
      const tabPanels = document.querySelectorAll('.tab-panel');

      function setActiveTab(tabName) {
        tabButtons.forEach((button) => {
          button.classList.toggle('active', button.dataset.tab === tabName);
        });

        tabPanels.forEach((panel) => {
          panel.classList.toggle('active', panel.id === `${tabName}Tab`);
        });
      }

      tabButtons.forEach((button) => {
        button.addEventListener('click', () => setActiveTab(button.dataset.tab));
      });

      function formatUptime(seconds) {
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return `${d}d ${h}h ${m}m ${s}s`;
      }

      function formatTimestamp(value) {
        if (!value) return '---';
        return new Date(value).toLocaleString('pl-PL');
      }

      async function loadSummary() {
        const response = await fetch('/api/dashboard-summary');
        const data = await response.json();

        if (!data.ok) {
          statusBadge.textContent = 'Błąd';
          statusBadge.className = 'status-badge error';
          statusText.textContent = 'Nie można pobrać statusu';
          return;
        }

        statusBadge.textContent = 'Online';
        statusBadge.className = 'status-badge online';
        statusText.textContent = 'Bot działa poprawnie';
        uptimeText.textContent = formatUptime(data.uptimeSeconds);
        guildsText.textContent = String(data.totalServers);
        ticketServersText.textContent = String(data.ticketServers);
        webhookServersText.textContent = String(data.webhookServers);
        logsCountText.textContent = String(data.logsCount);
        updatedAt.textContent = `Aktualizacja: ${formatTimestamp(data.lastUpdated)}`;
        logsUpdatedAt.textContent = `Aktualizacja: ${formatTimestamp(data.lastUpdated)}`;
      }

      async function loadServers() {
        const response = await fetch('/api/servers');
        const data = await response.json();

        guildsContainer.innerHTML = '';

        if (!data.ok || !Array.isArray(data.guilds) || data.guilds.length === 0) {
          guildsContainer.innerHTML = '<div class="empty">Brak podłączonych serwerów.</div>';
          return;
        }

        data.guilds.forEach((guild) => {
          const item = document.createElement('div');
          item.className = 'guild-item';
          item.innerHTML = `
            <div>
              <h3>${guild.name}</h3>
              <p>ID: ${guild.id}</p>
            </div>
            <div class="guild-meta">
              <span>Użytkownicy: ${guild.memberCount ?? 'N/A'}</span>
              <span>Kanały: ${guild.channels}</span>
              <span>Tickety: ${guild.ticketsEnabled ? 'tak' : 'nie'}</span>
              <span>Webhook: ${guild.webhookConfigured ? 'tak' : 'nie'}</span>
            </div>
          `;
          guildsContainer.appendChild(item);
        });
      }

      async function loadLogs() {
        const response = await fetch('/api/logs');
        const data = await response.json();

        logsContainer.innerHTML = '';

        if (!data.ok || !Array.isArray(data.logs) || data.logs.length === 0) {
          logsContainer.innerHTML = '<div class="empty">Brak logów.</div>';
          return;
        }

        data.logs.forEach((entry) => {
          const item = document.createElement('div');
          item.className = `log-item level-${entry.level || 'info'}`;
          item.innerHTML = `
            <div class="log-header">
              <span class="log-badge ${entry.level || 'info'}">${(entry.level || 'info').toUpperCase()}</span>
              <span class="log-time">${formatTimestamp(entry.timestamp)}</span>
            </div>
            <div class="log-message">${entry.message}</div>
          `;
          logsContainer.appendChild(item);
        });
      }

      async function refreshDashboard() {
        await Promise.all([loadSummary(), loadServers(), loadLogs()]);
      }

      setActiveTab('overview');
      refreshDashboard();
      setInterval(refreshDashboard, 15000);
    </script>
  </body>
</html>
